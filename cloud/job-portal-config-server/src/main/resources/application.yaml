spring:
  profiles:
    active: native
  application:
    name: job-portal-config-server
  cloud:
    config:
      server:
        native:
          search-locations:
            - file:./config-repo
            - file:../config-repo
            - file:../../config-repo
            - file:../../../config-repo

server:
  port: 8888

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
