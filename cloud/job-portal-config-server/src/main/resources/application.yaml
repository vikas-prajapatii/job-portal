spring:
  application:
    name: job-portal-config-server
  cloud:
    config:
      server:
        git:
          uri: https://github.com/vikas-prajapatii/job-portal.git
          search-paths: config-repo
          clone-on-start: true
          default-label: main


server:
  port: 8888

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
