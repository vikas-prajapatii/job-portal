    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: job_portal_preferencedb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
