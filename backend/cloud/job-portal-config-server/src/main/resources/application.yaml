server:
  port: 8888

spring:
  profiles:
    active: native
  application:
    name: job-portal-config-server
  cloud:
    config:
      server:
        native:
          search-locations:
            - file:./config-repo
            - file:../config-repo
            - file:../../config-repo
            - file:../../../config-repo
            - file:/config-repo

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health, info, refresh
  endpoint:
    health:
      show-details: always
