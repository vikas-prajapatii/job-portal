server:
  port: 8888

spring:
  application:
    name: job-portal-config-server
  cloud:
    config:
      server:
        git:
          uri: https://github.com/developer407/job-portal-config
          clone-on-start: true
          default-label: master

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health, info, refresh
  endpoint:
    health:
      show-details: always
